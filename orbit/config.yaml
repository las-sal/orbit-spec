schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Model hints (optional — D-arc Stage D5)
# When set, the eligibility line ("Ready when you are: ...") appends " — hint: <value>".
# Keys are schema phase ids (review-proposal, review-system, apply, archive) or review
# cadence slot names (in-context, fresh, external, independent, blind-pair); a slot entry wins
# over a phase entry. Under spec-driven v5 a first review slot is `invoked`, and its hint is
# read from the CLASS of the command presented (fresh or external) — a key naming
# `independent` or `blind-pair` garnishes only a schema that declares that slot. Values must
# be single-line, <= 80 chars. Unknown keys are inert.
# Example:
#   models:
#     fresh: "any frontier model, clean context"
#     external: "a different AI from the session's"
#     review-system: "strongest available reviewer"

# PR lifecycle (optional — D-arc Stage D6)
# A SINGLE scalar with exactly three values. Absent is the same as `never`.
#
#   never             No PR machinery anywhere; byte-identical to pre-capability behavior.
#                     Nothing is probed and nothing is printed.
#   per-proposal      Every change gets its own `<change-name>` branch and its own PR.
#   per-architecture  A change CITING an architecture doc rides that doc's program branch
#                     under the single-program-PR semantics. A change with NO citation
#                     FALLS BACK to per-proposal behavior (its own branch, its own PR), so
#                     a standalone change never loses its outward window.
#
# In every active mode a draft PR opens at propose (or, for a cited change under
# per-architecture, the single program PR is adopted or opened). The archive flow then:
#   per-proposal      commits, pushes, rewrites the description, and flips the PR READY.
#   per-architecture  commits, pushes, and APPENDS this stage's entry to the program PR —
#                     stage archives never flip it; the READY flip is YOUR act at arc-done.
# MERGING IS ALWAYS THE USER'S ACT.
#
# Degradation: with no git remote or no `gh` CLI, an ACTIVE mode degrades to `never`
# behavior for that invocation and says so in one line — the lifecycle never blocks on the
# PR layer. Under `never` (or absent) nothing is probed and no note is emitted.
# Example:
#   pr: per-architecture

# Review preference (optional — orbit-engine-gates, rc17a)
# A map from reviewed-gate id to blind-pair | fresh | external: which review the readout
# PRESENTS when nothing covers a gate's first (`invoked`) slot. It never changes what covers
# the slot — a single fresh or external pass, or a complete blind pair, covers whatever this
# says. Absent = blind-pair for every gate (until a one-command pair ships, that presents the
# fresh review). An unknown value warns and resolves to blind-pair; a key naming no reviewed
# gate warns and is ignored; a non-map value warns and is ignored.
# Example:
#   review_preference:
#     review-proposal: fresh
#     review-system: blind-pair

# Scenario map (optional — orbit-scenario-map, rc06a)
# Turns on the declaration check: `orbit validate <change>` reports every delta scenario no
# `// @scenario <behaviour|text> <capability> :: <requirement> :: <scenario>` tag (in the files
# these globs match) and no `orbit/scenario-ledger.yaml` entry declares — INFO until the change's
# apply gate passes, ERROR after. Absent = off, and validate behaves exactly as before.
# Read the map with: orbit status --change <name> --scenarios
scenario_map:
  tests: ['test/**/*.test.ts']
