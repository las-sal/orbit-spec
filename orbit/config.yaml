schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Model hints (optional — D-arc Stage D5)
# When set, the eligibility line ("Ready when you are: ...") appends " — hint: <value>".
# Keys are schema phase ids (review-proposal, review-system, apply, archive) or review
# cadence slot names (in-context, independent, external); a slot entry wins over a phase
# entry. Values must be single-line, <= 80 chars. Unknown keys are inert.
# Example:
#   models:
#     independent: "any frontier model, clean context"
#     review-system: "strongest available reviewer"
