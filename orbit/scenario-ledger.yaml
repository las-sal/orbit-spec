# The scenario ledger (orbit-scenario-map): declarations for scenarios no test can run.
# `untestable` carries a `why`; `observed` carries the `record` that observed it.
scenarios:
  # rc06b-map-readers (task 4.2) — process rules carried in this change's MODIFIED blocks.
  - key: "orbit-conventions :: Generated-file disposition :: Per-skill disposition is documented"
    kind: untestable
    why: "The scenario is a contributor act at a future engine upgrade (recording a disposition in that change's proposal); no test can observe a proposal not yet written."
  - key: "orbit-run-summary-emit :: Emit-layer wraps upstream skills without modifying them :: A cherry-picked verify body keeps the emit layer's additions"
    kind: untestable
    why: "The scenario is a deliberate cherry-pick of a newer upstream verify body, which this repo has not performed; the additions section's placement is tested, the cherry-pick act is not runnable."
  # rc06b-map-readers system walk 2 (Sal: A) — the unchanged-upstream-body half of this scenario. Its
  # additions half is a `text` test in test/core/templates/verify-scenario-map.test.ts; this half is an
  # observation, dated by its record, and no test re-runs it (no test here reads git history).
  - key: "orbit-conventions :: Generated-file disposition :: Upstream-verbatim — kept unchanged"
    kind: observed
    record: "orbit/changes/rc06b-map-readers/.orbit-runs/review-system-2026-10-05T00-27-56Z.json — the fresh system pass diffed every orbit-modified and upstream-verbatim body's upstream portion against upstream/v1.3.1 with the rename normalized; orbit-sync-specs' was unchanged"
  # rc17a-invoked-coverage (task 6.4) — a MODIFIED block's process claim carried with its requirement.
  - key: "orbit-engine-gates :: spec-driven v1 gates and cadence :: Cadence tuning is a schema edit"
    kind: untestable
    why: "The scenario is how a FUTURE revision changes the cadence (an edit to schema.yaml with a version bump, no engine code); no test can observe a revision not yet made. The current cadence living in the schema file is held by the v5 declaration test."
  # rc17d-external-runner (task 5.3) — two process claims carried in orbit-conventions' MODIFIED block.
  - key: "orbit-conventions :: Review mode decision framework :: A user doc stating the framework is held to this requirement"
    kind: untestable
    why: "The THEN is an /orbit:audit-drift Category 3 finding an AI produces on its next run, and the scenario's own text says no such user doc exists yet; there is no second statement for a test to compare."
  - key: "orbit-conventions :: Review mode decision framework :: Framework guidance is gate-surfaced, never gate-enforced"
    kind: untestable
    why: "The THEN is the archive body's inflection prompt and the user's proceed decision, choreography an AI follows in a session; the gate's computed unpassed state is engine-tested elsewhere, but the prompt-and-proceed act is not runnable."
  # rc17c-short-review-next (task 3.4) — the authoring half of a MODIFIED block's scenario.
  - key: "orbit-review :: Internal run summary persisted per mode :: Commentary carried for the renderer"
    kind: untestable
    why: "The carrying half is a behaviour test (the emit writes `commentary` verbatim); the other half, that commentary never asserts counts, verdicts or next commands, is a content rule on prose the reviewing AI authors, and no check can grade free prose for it."
  # rc17c-short-review-next (task 4.5) — two reader-side claims carried in orbit-conventions' MODIFIED block.
  - key: "orbit-conventions :: Internal-run JSON summary format :: Downstream status readers parse next_recommended uniformly across kinds"
    kind: untestable
    why: "The THEN is a downstream status reader's parse; no reader in this repo parses `next_recommended` (the v0.1 bash tool retired at D3), so there is nothing to run. The emit half, that every kind carries the field, is held by the canonical-example guard."
  - key: "orbit-conventions :: Internal-run JSON summary format :: Future consumers route by `kind` field rather than parsing filename prefix"
    kind: untestable
    why: "The THEN is a permission (MAY) granted to consumers outside this repo; no in-repo consumer routes by either key, so there is no behaviour to observe. Every emit carrying `kind` is held by the canonical-example guard."
  # rc18-walk-is-next system walk (Sal: 2A) — a reader-side claim carried in orbit-run-summary-emit's MODIFIED block.
  - key: "orbit-run-summary-emit :: Verify pass recommendation :: Status reader parses verify-pass recommendation"
    kind: untestable
    why: "The THEN is a downstream status reader's best-effort parse of `next_recommended` into `command`/`args`; no reader in this repo performs that parse (the v0.1 bash tool retired at D3), so there is nothing to run. The emit half, that the text leads with the graph's command, is held by the verify-pass behaviour tests in outstanding-passes.test.ts."
  # rc10-apply-closure (task 3.1) — two authoring claims carried in orbit-archive-modifications' MODIFIED
  # `Archive run summary written` block. The carrying half (an `accepted` pair and a `warnings` entry
  # are each persisted as written) is a behaviour test; which of the two a residual belongs in is not.
  - key: "orbit-archive-modifications :: Archive run summary written :: Residual risk moves out of warnings and into accepted"
    kind: untestable
    why: "The THEN classifies a residual by whether independent review output informed it, a judgement the archiving AI makes in a session; the write gate persists whatever it is given, and no check can tell a pass-formed residual written into `warnings` from a seam note."
  - key: "orbit-archive-modifications :: Archive run summary written :: A seam-arising process note stays in warnings"
    kind: untestable
    why: "The same classification seen from the other side: whether a note was formed against an independent pass is the archiving AI's judgement, not a property of the record the engine can read."
  - key: "orbit-engine-gates :: Inflection-prompt override contract :: The prompt is the only skip surface"
    kind: untestable
    why: "The THEN is an absence across every recommendation an AI composes in chat; the engine's eligibility lines are composed from the gate graph and never offer a skip, but a body's prose recommendation is authored in a session and no test can enumerate it."
  # concept-docs (task 4.2, design D6) — exit (3): the migration guide run once, as written, on a 1.14.1 project.
  - key: "orbit-user-docs :: The migration guide opens with a before-you-move checklist for an OpenSpec 1.x project :: The guide's steps move a 1.14.1 project"
    kind: observed
    record: "orbit/changes/archive/2026-10-13-concept-docs/migration-run.md — the checklist read from the guide's fences reported each of eight fixtures; after the fixes and the move, run before any orbit init (4A) and after one (4B), orbit list, orbit status and orbit validate --all read the project, with nothing under orbit/openspec/; and an orbit/ holding an exploration (4C) is given no move command"
  # public-readiness (task 5.3, design D7) — observed in the change's readiness record. The archive re-points these
  # citations to the archived path (the scenario-map reader checks only that a record is non-empty).
  - key: "orbit-public-repository :: CI checks every commit with orbit's toolchain :: CI passes on the change that moves it"
    kind: observed
    record: "orbit/changes/archive/2026-10-13-public-readiness/readiness-record.md §3 — the pull request's CI run, every job's outcome with both test legs"
  - key: "orbit-public-repository :: A secrets-and-paths scan is recorded before the first public release :: Every finding is resolved or accepted with its class's reason"
    kind: observed
    record: "orbit/changes/archive/2026-10-13-public-readiness/readiness-record.md §1 — zero token candidates in the tree and in every blob reachable from main and the change's branch (merge commits and renames included); every published ref checked; every absolute-path finding and authorship address under its row, two resolved at apply"
  - key: "orbit-public-repository :: A secrets-and-paths scan is recorded before the first public release :: The pattern scan's residual is read, not assumed"
    kind: observed
    record: "orbit/changes/archive/2026-10-13-public-readiness/readiness-record.md §1 — the 13 living config-shaped files read by eye, and 1,184 records and fixtures read by machine (a keyword sweep and a high-entropy scan), with what each read found"
  # decision-layer (task 3.5) — three scenarios that are a writer's or a reader's judgement (R-crc-10).
  - key: "orbit-decision-records :: Decision records are written for a reader who knows only the architecture :: Detail is never the only statement"
    kind: untestable
    why: "Whether `decided` states the decision or only points at `detail` is a reader's judgement on prose; orbit checks only that the field is a non-blank string, and the reading step that grades it belongs to stage `decision-reading` (D-dl-8)."
  - key: "orbit-decision-records :: The ledger's eighteen areas :: An internal call writes no entry"
    kind: untestable
    why: "The THEN is an entry the AI does not write; whether a call falls in an area is the AI's judgement, which the decision-writing discipline (`orbit-conventions`) leaves to it. orbit checks only that a written entry names one of the eighteen ids."
  - key: "orbit-decision-records :: Decision records are written for a reader who knows only the architecture :: A coined term is defined in the record"
    kind: untestable
    why: "Whether a term is new to a reader of the architecture doc is a reader's judgement; the write gate checks that every listed term has a definition (`An undefined term is refused`), never that every new term was listed."
  # decision-writing (task 4.3, design D6) — the AI-conduct scenarios of the MODIFIED `No-chaining contract`
  # (carried unchanged) and of the ADDED `Decision-writing discipline`. Each THEN is what an AI does in a live
  # session; the body text that instructs it is held by test/core/decision-writing-parity.test.ts, and whether a
  # run followed it is read from its trail at automate-dev-flow's first-run (G2, G4).
  - key: "orbit-conventions :: No-chaining contract :: Command completion ends the turn"
    kind: untestable
    why: "The THEN is the AI stopping its turn after the readout instead of invoking the eligible command, an act in a live session; no test runs a session. The bodies' no-chaining bullet is held by the epitome tests."
  - key: "orbit-conventions :: No-chaining contract :: Blanket delegation does not cross commands"
    kind: untestable
    why: "The THEN is how the AI reads a user's delegation phrase across commands, a judgement in a live session; no test runs a session."
  - key: "orbit-conventions :: No-chaining contract :: Explicit multi-command requests are honored as scoped"
    kind: untestable
    why: "The THEN is the AI running exactly the commands a user's message names, a judgement in a live session; no test runs a session."
  - key: "orbit-conventions :: Decision-writing discipline :: A stop record precedes the question it keeps"
    kind: untestable
    why: "The THEN is the order of the AI's acts in a live session (the stop record, then the question, then the resolution); the write gate checks each record's form, never that one was owed. First-run's closing review grades it from the trail (G2, G4)."
  - key: "orbit-conventions :: Decision-writing discipline :: A call put to the user leaves all three records"
    kind: untestable
    why: "The THEN is the AI writing a stop, a resolution and a ledger entry around a question it asks in a live session; the gate's acceptance of each record is tested in decision-records.test.ts, the writing of them is not runnable. Graded at first-run (G2, G4)."
  - key: "orbit-conventions :: Decision-writing discipline :: A call relying on nothing, made without asking, names an open stop"
    kind: untestable
    why: "The THEN is the AI recognising an uncovered call where today's flow asks nothing and recording an open stop; the gate's acceptance of `relies_on: []` with `raised_stop` is tested in decision-records.test.ts, the recognition is a judgement in a live session. Graded at first-run (G2, G4)."
  - key: "orbit-conventions :: Decision-writing discipline :: A session with no change and no doc writes no record"
    kind: untestable
    why: "The THEN is the AI withholding a record during a project-wide run, an act in a live session; no test runs a session, and an unwritten record leaves nothing to inspect."
  - key: "orbit-conventions :: Decision-writing discipline :: A seam prompt writes nothing"
    kind: untestable
    why: "The THEN is the AI writing no record at a consent or inflection prompt, an act in a live session; no test runs a session, and an unwritten record leaves nothing to inspect."
  - key: "orbit-conventions :: Decision-writing discipline :: A seam a stop condition describes writes its stop first"
    kind: untestable
    why: "The THEN is the AI writing an unresolvable-critical stop before a gate's inflection prompt, the order of acts in a live session; no test runs a session. Graded at first-run (G2, G4)."
  # decision-writing system walk (2026-11-08, external W2/W3) — the two moments the walk added to the statement.
  - key: "orbit-conventions :: Decision-writing discipline :: An act the user directed writes its stop and its resolution"
    kind: untestable
    why: "The THEN is the AI recognising a ruling amendment the user directed and writing a stop and a resolution around it, the order of acts in a live session; no test runs a session. Graded at first-run (G2, G4)."
  - key: "orbit-conventions :: Decision-writing discipline :: A walk of an archived change writes no record"
    kind: untestable
    why: "The THEN is the AI withholding a record during a walk of an archived change; no test runs a session, and an unwritten record leaves nothing to inspect. The engine's refusal of a decision record on an archived change is its existing scope rule (no archived fallback for ledger, stop or resolution)."
