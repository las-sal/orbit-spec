# Apply a proposed change whose review-proposal gate has passed.
max_turns: 40
max_budget_usd: 3
start:
  - args: [status, --change, greet-name, --json]
    path: gates[id=review-proposal].state
    equals: passed
  - args: [status, --change, greet-name, --json]
    path: gates[id=apply].state
    equals: ready
break:
  # The emit step cut from the body AND its reference: the 2026-11-20 broken run's session read
  # references/run-summary-emit.md after the body section was gone, and emitted anyway.
  file: .claude/skills/orbit-apply-change/SKILL.md
  section: "## Run-summary emit (chunk-aware"
  remove: [references/run-summary-emit.md]
  grader: apply-emit-printed
