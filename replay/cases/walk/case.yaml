# The walk of an in-context system pass whose findings are obvious fixes only.
max_turns: 50
max_budget_usd: 3
start:
  - args: [status, --change, greet-name, --json]
    path: gates[id=review-system].reason
    matches: unresolved substantive findings
break:
  # The persist step (### 6 — the 2026-11-20 run cut ### 5, the report, by mistake) AND the emit and
  # payload-schema references (that run's session read both).
  file: .claude/skills/orbit-address-reviews/SKILL.md
  section: "### 6. Persist the run summary"
  remove: [references/run-summary-emit.md, references/run-summary-schema.md]
  grader: walk-emit-printed
