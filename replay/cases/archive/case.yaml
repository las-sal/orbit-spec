# Archive the walked change: review-system has passed.
max_turns: 60
max_budget_usd: 4
start:
  - args: [status, --change, greet-name, --json]
    path: gates[id=review-system].state
    equals: passed
  - args: [status, --change, greet-name, --json]
    path: gates[id=apply].state
    equals: passed
break:
  # The run-summary step cut from the body AND its emit and summary-schema references (the
  # 2026-11-20 broken run read both).
  file: .claude/skills/orbit-archive-change/SKILL.md
  section: "## Step 5.5 — Archive run summary"
  remove: [references/run-summary-emit.md, references/archive-summary-schema.md]
  grader: archive-emit-printed
